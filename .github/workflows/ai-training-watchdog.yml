name: Continuous AI Training Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: continuous-ai-training-watchdog
  cancel-in-progress: false

jobs:
  ensure-running:
    if: ${{ vars.AI_CONTINUOUS_TRAINING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start training only when idle
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          active=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ai-training.yml/runs" -f branch="$DEFAULT_BRANCH" -f per_page=100 --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Distributed AI training is already active."
            exit 0
          fi

          gh workflow run ai-training.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f workers=2 \
            -f training_matches=96 \
            -f evaluation_matches=16 \
            -f minimum_score=0.56 \
            -f minimum_games=32 \
            -f continuous=true
