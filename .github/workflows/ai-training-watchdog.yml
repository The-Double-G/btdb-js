name: Continuous AI Training Watchdog

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "2,32,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: continuous-ai-training-watchdog
  cancel-in-progress: false

jobs:
  ensure-running:
    if: ${{ vars.AI_CONTINUOUS_TRAINING_ENABLED == 'true' && vars.AI_HOSTED_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start training only when the transaction is idle and healthy
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          retained=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/ai-promotion/" --jq '.[].ref')
          if [ -n "$retained" ]; then
            echo "Retained AI promotion branch(es) indicate an unresolved hosted/audit transaction:" >&2
            echo "$retained" >&2
            echo "Reconcile or remove the retained branch before continuous training resumes." >&2
            exit 1
          fi

          active=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ai-training.yml/runs" -f branch="$DEFAULT_BRANCH" -f per_page=100 --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "Distributed AI training is already active."
            exit 0
          fi

          recent=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ai-training.yml/runs" -f branch="$DEFAULT_BRANCH" -f status=completed -f per_page=3 --jq '[.workflow_runs[].conclusion]')
          if node -e 'const values=JSON.parse(process.argv[1]);const failed=new Set(["failure","timed_out","startup_failure","action_required"]);process.exit(values.length>=3&&values.slice(0,3).every(value=>failed.has(value))?0:1)' "$recent"; then
            echo "Circuit breaker open: the last 3 default-branch training runs failed. Investigate before retrying." >&2
            exit 1
          fi

          gh workflow run ai-training.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f workers=20 \
            -f training_matches=192 \
            -f evaluation_matches=16 \
            -f minimum_score=0.58 \
            -f minimum_games=160 \
            -f continuous=true
