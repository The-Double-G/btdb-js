name: Promote AI Checkpoint

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: Successful Distributed AI Training workflow run ID
        required: true
      reconcile_hosted_promotion:
        description: Audit a candidate already published to the Hosted Model after a failed final push
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  AI_ARTIFACT_MAX_BYTES: 8388608

jobs:
  validate:
    if: ${{ vars.AI_CONTINUOUS_TRAINING_ENABLED != 'true' && vars.AI_HOSTED_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      candidate_sha256: ${{ steps.bundle.outputs.candidate_sha256 }}
      training_sha: ${{ steps.metadata.outputs.training_sha }}
      base_sha: ${{ steps.metadata.outputs.base_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: metadata
        name: Validate training run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RECONCILE: ${{ inputs.reconcile_hosted_promotion }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "training_run_id must be numeric" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/training-run.json"
          workflow_id=$(node -e "const run=require(process.argv[1]);process.stdout.write(String(run.workflow_id));" "$RUNNER_TEMP/training-run.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/training-workflow.json"
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          node -e "const run=require(process.argv[1]);const workflow=require(process.argv[2]);const repo=require(process.argv[3]);const reconcile=process.env.RECONCILE==='true';if(workflow.path!=='.github/workflows/ai-training.yml'||workflow.name!=='Distributed AI Training')throw new Error('Run is not from the distributed training workflow');if(run.event!=='workflow_dispatch'||run.status!=='completed'||(!reconcile&&run.conclusion!=='success'))throw new Error(reconcile?'Reconciliation requires a completed workflow_dispatch':'Training run must be a successful workflow_dispatch');if(run.head_branch!==repo.default_branch)throw new Error('Training run is not from the default branch');if(!run.head_sha||!repo.default_branch)throw new Error('Training run metadata is incomplete');" "$RUNNER_TEMP/training-run.json" "$RUNNER_TEMP/training-workflow.json" "$RUNNER_TEMP/repository.json"
          training_sha=$(node -e "const run=require(process.argv[1]);process.stdout.write(run.head_sha);" "$RUNNER_TEMP/training-run.json")
          base_sha=$(git rev-parse HEAD)
          if [ "$training_sha" != "$base_sha" ]; then
            if [ "$RECONCILE" != "true" ]; then
              echo "Training run is not from the exact current default-branch commit." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$training_sha" "$base_sha"; then
              echo "Reconciliation training commit is not an ancestor of the current default branch." >&2
              exit 1
            fi
          fi
          echo "training_sha=$training_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Download evaluated bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          for attempt in 1 2 3; do
            attempt_dir="$RUNNER_TEMP/bundle-attempt-$attempt"
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ai-training-bundle --dir "$attempt_dir"; then
              mv "$attempt_dir" "$RUNNER_TEMP/bundle"
              exit 0
            fi
            rm -rf "$attempt_dir"
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to download the evaluated bundle after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - id: bundle
        name: Validate and stage promotion
        run: |
          oversized=$(find "$RUNNER_TEMP/bundle" -type f -size "+${AI_ARTIFACT_MAX_BYTES}c" -print -quit)
          if [ -n "$oversized" ]; then
            echo "Promotion artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes: $oversized" >&2
            exit 1
          fi
          npm run ai:verify -- "$RUNNER_TEMP/bundle/candidate.json"
          npm run ai:verify -- "$RUNNER_TEMP/bundle/evaluation.json"
          npm run ai:verify-promotion -- --candidate "$RUNNER_TEMP/bundle/candidate.json" --evaluation "$RUNNER_TEMP/bundle/evaluation.json" --baseline "$RUNNER_TEMP/bundle/baseline.json" --minimum-score 0.58 --minimum-games 64
          cp "$RUNNER_TEMP/bundle/candidate.json" training/checkpoints/champion.json
          echo "candidate_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install browser for promotion checks
        run: npx playwright install --with-deps chromium
      - name: Run promotion checks
        run: npm test

  promote:
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ai-checkpoint-promotion
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      promotion_branch: ${{ steps.promotion.outputs.promotion_branch }}
      promotion_sha: ${{ steps.promotion.outputs.promotion_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Download validated bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          for attempt in 1 2 3; do
            attempt_dir="$RUNNER_TEMP/bundle-attempt-$attempt"
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ai-training-bundle --dir "$attempt_dir"; then
              mv "$attempt_dir" "$RUNNER_TEMP/bundle"
              exit 0
            fi
            rm -rf "$attempt_dir"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - id: commit
        name: Prepare validated checkpoint commit
        env:
          CANDIDATE_SHA256: ${{ needs.validate.outputs.candidate_sha256 }}
          RUN_ID: ${{ inputs.training_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$BASE_SHA" ] || [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "Default branch changed after training began; refusing stale promotion." >&2
            exit 1
          fi

          if [ ! -f "$RUNNER_TEMP/bundle/candidate.json" ] || [ -L "$RUNNER_TEMP/bundle/candidate.json" ]; then
            echo "Candidate artifact is not a regular file." >&2
            exit 1
          fi
          candidate_size=$(stat -c%s "$RUNNER_TEMP/bundle/candidate.json")
          if [ "$candidate_size" -gt "$AI_ARTIFACT_MAX_BYTES" ]; then
            echo "Candidate artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes." >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)
          if [ -z "$CANDIDATE_SHA256" ] || [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo "Candidate artifact checksum changed after validation." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/bundle/candidate.json" training/checkpoints/champion.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/checkpoints/champion.json
          if git diff --cached --quiet; then
            echo "Checkpoint is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != "training/checkpoints/champion.json" ]; then
            echo "Promotion attempted to modify unexpected files." >&2
            exit 1
          fi
          git commit -m "Promote AI checkpoint from run $RUN_ID"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - id: promotion
        name: Require CI on the exact promotion commit
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
        run: |
          promotion_branch="ai-promotion/manual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          promotion_sha=$(git rev-parse HEAD)
          keep_branch=false
          cleanup() {
            if [ "$keep_branch" != "true" ]; then
              git push origin --delete "$promotion_branch" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          git push origin "HEAD:refs/heads/$promotion_branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$promotion_branch"

          ci_run_id=""
          for _ in $(seq 1 30); do
            ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$promotion_branch" --event workflow_dispatch --limit 100 --json databaseId,headSha --jq ".[] | select(.headSha == \"$promotion_sha\") | .databaseId" | head -n 1)
            if [ -n "$ci_run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$ci_run_id" ]; then
            echo "Could not locate the promotion CI run." >&2
            exit 1
          fi
          gh run watch "$ci_run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "promotion_branch=$promotion_branch" >> "$GITHUB_OUTPUT"
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
          keep_branch=true

  publish-hosted:
    needs: [validate, promote]
    if: ${{ always() && needs.promote.result == 'success' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    environment: production-ai
    concurrency:
      group: ai-hosted-promotion
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 2
          ref: ${{ needs.promote.outputs.promotion_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download validated bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.training_run_id }}
        run: |
          for attempt in 1 2 3; do
            attempt_dir="$RUNNER_TEMP/bundle-attempt-$attempt"
            if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ai-training-bundle --dir "$attempt_dir"; then
              mv "$attempt_dir" "$RUNNER_TEMP/bundle"
              exit 0
            fi
            rm -rf "$attempt_dir"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Publish verified policy to the hosted model
        env:
          AI_HOSTED_ENDPOINT: ${{ vars.AI_HOSTED_ENDPOINT }}
          AI_POLICY_PROMOTION_KEY: ${{ secrets.AI_POLICY_PROMOTION_KEY }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.candidate_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_SHA: ${{ needs.promote.outputs.promotion_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          RECONCILE: ${{ inputs.reconcile_hosted_promotion }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$BASE_SHA" ] || [ "$(git rev-parse HEAD)" != "$PROMOTION_SHA" ]; then
            echo "Promotion commit or default branch changed before hosted publication." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$PROMOTION_SHA^")" != "$BASE_SHA" ] || [ "$(git diff-tree --no-commit-id --name-only -r "$PROMOTION_SHA")" != "training/checkpoints/champion.json" ]; then
            echo "Hosted publication was not built from the checked checkpoint-only commit." >&2
            exit 1
          fi
          candidate_size=$(stat -c%s "$RUNNER_TEMP/bundle/candidate.json")
          if [ "$candidate_size" -gt "$AI_ARTIFACT_MAX_BYTES" ]; then
            echo "Candidate artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes." >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)
          if [ -z "$CANDIDATE_SHA256" ] || [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo "Candidate artifact checksum changed before hosted publication." >&2
            exit 1
          fi
          mode=publish
          if [ "$RECONCILE" = "true" ]; then mode=reconcile; fi
          npm run ai:hosted -- --mode "$mode" --endpoint "$AI_HOSTED_ENDPOINT" --baseline "$RUNNER_TEMP/bundle/baseline.json" --manifest "$RUNNER_TEMP/bundle/hosted-source.json" --candidate "$RUNNER_TEMP/bundle/candidate.json" --evaluation "$RUNNER_TEMP/bundle/evaluation.json" --receipt "$RUNNER_TEMP/hosted-promotion-receipt.json" --minimum-score 0.58 --minimum-games 64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ai-hosted-promotion-receipt
          path: ${{ runner.temp }}/hosted-promotion-receipt.json
          retention-days: 30
          if-no-files-found: error

  finalize-promotion:
    needs: [validate, promote, publish-hosted]
    if: ${{ always() && needs.promote.result == 'success' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - id: merge
        name: Merge the checked promotion pull request
        if: ${{ needs.publish-hosted.result == 'success' && vars.AI_HOSTED_PROMOTION_ENABLED == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_BRANCH: ${{ needs.promote.outputs.promotion_branch }}
          PROMOTION_SHA: ${{ needs.promote.outputs.promotion_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          RUN_ID: ${{ inputs.training_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$PROMOTION_BRANCH:refs/remotes/origin/$PROMOTION_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$BASE_SHA" ]; then
            echo "Default branch changed while promotion CI ran; refusing stale promotion." >&2
            exit 1
          fi
          if [ -z "$PROMOTION_SHA" ] || [ "$(git rev-parse "origin/$PROMOTION_BRANCH")" != "$PROMOTION_SHA" ]; then
            echo "Temporary promotion branch does not match the checked commit." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$PROMOTION_SHA^")" != "$BASE_SHA" ] || [ "$(git diff-tree --no-commit-id --name-only -r "$PROMOTION_SHA")" != "training/checkpoints/champion.json" ]; then
            echo "Promotion commit ancestry or contents changed." >&2
            exit 1
          fi
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$PROMOTION_BRANCH" \
            --title "Promote AI checkpoint from run $RUN_ID" \
            --body "This checkpoint passed exact-commit CI and hosted publication. Merge only this checkpoint-only promotion commit.")
          pr_number="${pr_url##*/}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid promotion pull request URL: $pr_url" >&2
            exit 1
          fi
          checks_reported=false
          approval_requested=false
          for _ in $(seq 1 60); do
            reported=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup --jq '.statusCheckRollup | length')
            if [ "$reported" -gt 0 ]; then
              checks_reported=true
              break
            fi
            if [ "$approval_requested" != "true" ]; then
              approval_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$PROMOTION_BRANCH" \
                --event pull_request --limit 20 --json databaseId,headSha,conclusion \
                --jq ".[] | select(.headSha == \"$PROMOTION_SHA\" and .conclusion == \"action_required\") | .databaseId" | head -n 1)
              if [ -n "$approval_run" ]; then
                approval_metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$approval_run")
                if ! jq -e --arg branch "$PROMOTION_BRANCH" --arg sha "$PROMOTION_SHA" --arg base "$DEFAULT_BRANCH" --argjson pr "$pr_number" '
                  .path == ".github/workflows/ci.yml" and
                  .event == "pull_request" and
                  .status == "completed" and
                  .conclusion == "action_required" and
                  .head_branch == $branch and
                  .head_sha == $sha and
                  .actor.login == "github-actions[bot]" and
                  .triggering_actor.login == "github-actions[bot]" and
                  (.pull_requests | length) == 1 and
                  .pull_requests[0].number == $pr and
                  .pull_requests[0].head.ref == $branch and
                  .pull_requests[0].head.sha == $sha and
                  .pull_requests[0].base.ref == $base
                ' <<<"$approval_metadata" >/dev/null; then
                  echo "Refusing to approve CI run $approval_run because it does not match this promotion transaction." >&2
                  exit 1
                fi
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$approval_run/approve" >/dev/null
                echo "Approved trusted promotion CI run $approval_run."
                approval_requested=true
              fi
            fi
            sleep 2
          done
          if [ "$checks_reported" != "true" ]; then
            if [ "$approval_requested" = "true" ]; then
              echo "Approved promotion CI did not report required checks within 120 seconds." >&2
            else
              echo "Required checks were not reported for promotion pull request $pr_number." >&2
            fi
            exit 1
          fi
          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required --watch --interval 10
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "Promote AI checkpoint from run $RUN_ID" \
            --body "Merge the validated checkpoint after required branch-protection checks passed."
          merged_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          merged_parent=$(gh api "repos/$GITHUB_REPOSITORY/commits/$merged_sha" --jq \
            'if ((.parents | length) == 1 and (.files | length) == 1 and .files[0].filename == "training/checkpoints/champion.json") then .parents[0].sha else "" end')
          if [ "$merged_parent" != "$BASE_SHA" ]; then
            echo "Merged promotion commit ancestry or contents changed." >&2
            exit 1
          fi
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"
      - name: Require CI on the exact merged main commit
        if: ${{ steps.merge.outcome == 'success' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [ -z "$MERGED_SHA" ] || [ "$current_sha" != "$MERGED_SHA" ]; then
            echo "Default branch changed before merged-commit CI could start." >&2
            exit 1
          fi
          before_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f per_page=100 --jq '[.workflow_runs[].id] | max // 0')
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          ci_run_id=""
          for _ in $(seq 1 30); do
            ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$DEFAULT_BRANCH" \
              --event workflow_dispatch --limit 100 --json databaseId,headSha \
              --jq ".[] | select(.databaseId > $before_id and .headSha == \"$MERGED_SHA\") | .databaseId" | head -n 1)
            if [ -n "$ci_run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$ci_run_id" ]; then
            echo "Could not locate CI for merged main commit $MERGED_SHA." >&2
            exit 1
          fi
          gh run watch "$ci_run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Remove temporary promotion branch
        if: ${{ always() }}
        env:
          PROMOTION_BRANCH: ${{ needs.promote.outputs.promotion_branch }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          if [ -n "$PROMOTION_BRANCH" ] && [ "$MERGE_OUTCOME" = "success" ]; then
            git push origin --delete "$PROMOTION_BRANCH" >/dev/null 2>&1 || true
          elif [ -n "$PROMOTION_BRANCH" ]; then
            echo "Retaining $PROMOTION_BRANCH for hosted/audit reconciliation." >> "$GITHUB_STEP_SUMMARY"
          fi
