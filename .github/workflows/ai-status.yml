name: Publish AI Training Status

on:
  workflow_run:
    workflows: ["Distributed AI Training"]
    types: [requested, in_progress, completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: ai-training-status-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.name == 'Distributed AI Training' && github.event.workflow_run.path == '.github/workflows/ai-training.yml' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          ref: main
          persist-credentials: false
      - name: Publish validated trainer status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/distributed-ai/training-status.js
