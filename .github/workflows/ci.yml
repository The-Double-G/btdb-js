name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          files: .github/workflows/*.yml
          pyflakes: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run validate
      - run: npm run test:distributed
      - run: npx playwright install chromium
      - run: npm run test:headless
      - run: npm run test:status
      - run: npm run audit:public
      - run: php -v
      - run: npm run test:endpoint

  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:browser
      - name: Initialize checkpoint
        run: npm run ai:init -- --seed 253 --shard ci-init --output "$RUNNER_TEMP/champion.json"
      - name: Replay one deterministic learning match twice
        run: |
          mkdir -p "$RUNNER_TEMP/train" "$RUNNER_TEMP/replay"
          npm run ai:worker -- --mode train --checkpoint "$RUNNER_TEMP/champion.json" --seed 1000 --shard ci-train --matches 1 --output "$RUNNER_TEMP/train/result.json"
          npm run ai:worker -- --mode train --checkpoint "$RUNNER_TEMP/champion.json" --seed 1000 --shard ci-train --matches 1 --output "$RUNNER_TEMP/replay/result.json"
      - name: Verify deterministic replay identities
        run: node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.argv[1]));const b=JSON.parse(fs.readFileSync(process.argv[2]));if(a.resultId!==b.resultId||a.candidate.checkpointId!==b.candidate.checkpointId)throw new Error('Deterministic replay identities differ');" "$RUNNER_TEMP/train/result.json" "$RUNNER_TEMP/replay/result.json"
      - name: Select candidate
        run: npm run ai:select -- --results-dir "$RUNNER_TEMP/train" --baseline "$RUNNER_TEMP/champion.json" --output "$RUNNER_TEMP/candidate.json"
      - name: Evaluate one balanced frozen eight-scenario block
        run: |
          mkdir -p "$RUNNER_TEMP/eval" "$RUNNER_TEMP/baseline-eval" "$RUNNER_TEMP/baseline-replay"
          npm run ai:worker -- --mode evaluate --checkpoint "$RUNNER_TEMP/candidate.json" --baseline "$RUNNER_TEMP/champion.json" --seed 100000 --shard ci-eval --matches 8 --output "$RUNNER_TEMP/eval/result.json"
          npm run ai:worker -- --mode evaluate --checkpoint "$RUNNER_TEMP/champion.json" --baseline "$RUNNER_TEMP/champion.json" --baseline-only true --seed 100000 --shard ci-baseline-eval --matches 8 --output "$RUNNER_TEMP/baseline-eval/result.json"
          npm run ai:worker -- --mode evaluate --checkpoint "$RUNNER_TEMP/champion.json" --baseline "$RUNNER_TEMP/champion.json" --baseline-only true --seed 100000 --shard ci-baseline-eval --matches 8 --output "$RUNNER_TEMP/baseline-replay/result.json"
      - name: Verify deterministic baseline reference replay
        run: node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync(process.argv[1]));const b=JSON.parse(fs.readFileSync(process.argv[2]));if(a.resultId!==b.resultId||a.candidateCheckpointId!==b.candidateCheckpointId)throw new Error('Baseline reference replay identities differ');" "$RUNNER_TEMP/baseline-eval/result.json" "$RUNNER_TEMP/baseline-replay/result.json"
      - name: Aggregate smoke evaluation
        run: |
          npm run ai:evaluate-report -- --results-dir "$RUNNER_TEMP/eval" --output "$RUNNER_TEMP/evaluation.json" --minimum-score 0 --minimum-games 8
          npm run ai:evaluate-report -- --results-dir "$RUNNER_TEMP/baseline-eval" --output "$RUNNER_TEMP/baseline-evaluation.json" --minimum-score 0 --minimum-games 8
          npm run ai:compare-quality -- --candidate "$RUNNER_TEMP/evaluation.json" --baseline "$RUNNER_TEMP/baseline-evaluation.json" --output "$RUNNER_TEMP/quality.json" --minimum-games 8
      - run: npm run ai:verify -- "$RUNNER_TEMP/candidate.json"
      - run: npm run ai:verify -- "$RUNNER_TEMP/evaluation.json"
      - run: npm run ai:verify -- "$RUNNER_TEMP/quality.json"
