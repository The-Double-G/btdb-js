name: Distributed AI Training
run-name: ${{ inputs.continuous && format('Continuous AI training for {0}', inputs.expected_sha) || 'Manual AI training' }}

on:
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel training and evaluation shards
        required: true
        type: choice
        default: "8"
        options: ["2", "4", "8", "16", "20"]
      training_matches:
        description: Browser Lab matches per shard (128 learning + 64 internal evaluation)
        required: true
        default: "192"
      evaluation_matches:
        description: Frozen matches per evaluation shard
        required: true
        default: "16"
      base_seed:
        description: First deterministic seed; blank allocates a unique seed block
        required: false
      minimum_score:
        description: Required frozen evaluation score
        required: true
        default: "0.58"
      minimum_games:
        description: Required total frozen evaluation games
        required: true
        default: "64"
      continuous:
        description: Automatically promote passing candidates in a watchdog-coordinated series
        required: true
        type: boolean
        default: false
      expected_sha:
        description: Exact current main commit required for continuous training
        required: false

permissions:
  actions: read
  contents: read

env:
  AI_ARTIFACT_MAX_BYTES: 8388608

concurrency:
  group: distributed-ai-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
      workers: ${{ steps.config.outputs.workers }}
      training_matches: ${{ steps.config.outputs.training_matches }}
      evaluation_matches: ${{ steps.config.outputs.evaluation_matches }}
      base_seed: ${{ steps.config.outputs.base_seed }}
      minimum_score: ${{ steps.config.outputs.minimum_score }}
      minimum_games: ${{ steps.config.outputs.minimum_games }}
      continuous: ${{ steps.config.outputs.continuous }}
      expected_sha: ${{ steps.config.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ai:verify -- training/checkpoints/champion.json
      - id: config
        name: Validate configuration and build shard matrix
        env:
          WORKERS: ${{ inputs.workers }}
          TRAINING_MATCHES: ${{ inputs.training_matches }}
          EVALUATION_MATCHES: ${{ inputs.evaluation_matches }}
          BASE_SEED: ${{ inputs.base_seed }}
          MINIMUM_SCORE: ${{ inputs.minimum_score }}
          MINIMUM_GAMES: ${{ inputs.minimum_games }}
          CONTINUOUS: ${{ inputs.continuous }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")

          function integer(name, minimum, maximum) {
              const raw = process.env[name] || ""
              if(!/^(0|[1-9][0-9]*)$/.test(raw)) throw new Error(`${name} must be a non-negative integer`)
              const value = Number(raw)
              if(!Number.isSafeInteger(value) || value < minimum || maximum != null && value > maximum) throw new Error(`${name} is out of range`)
              return value
          }

          const workers = integer("WORKERS", 1, 20)
          const training = integer("TRAINING_MATCHES", 1)
          const evaluation = integer("EVALUATION_MATCHES", 1)
          const minimumGames = integer("MINIMUM_GAMES", 1)
          const minimumScore = Number(process.env.MINIMUM_SCORE)
          const continuous = process.env.CONTINUOUS === "true"
          const expectedSha = process.env.EXPECTED_SHA || ""
          let seed
          if((process.env.BASE_SEED || "") === "") {
              seed = integer("RUN_NUMBER", 1, 42934) * 100032
          } else {
              seed = integer("BASE_SEED", 0, 0xffffffff)
          }

          if(training !== 192) throw new Error("TRAINING_MATCHES must be exactly 192 (128 learning plus 64 internal evaluation)")
          if(evaluation % 8 !== 0) throw new Error("EVALUATION_MATCHES must be a positive multiple of 8")
          if(!Number.isFinite(minimumScore) || minimumScore < 0 || minimumScore > 1) throw new Error("MINIMUM_SCORE must be between 0 and 1")
          if(workers * evaluation < minimumGames) throw new Error("Total evaluation games are below MINIMUM_GAMES")
          if(seed + 100000 + workers - 1 > 0xffffffff) throw new Error("BASE_SEED is too large for evaluation shard seeds")
          if(continuous && (workers !== 20 || evaluation !== 16)) throw new Error("Continuous training requires 20 workers and 16 external evaluation matches per worker")
          if(continuous && (minimumScore < 0.58 || minimumGames < 160)) throw new Error("Continuous promotion requires at least a 0.58 score and 160 balanced games")
          if(continuous && (process.env.BASE_SEED || "") !== "") throw new Error("Continuous training allocates its own seed block; BASE_SEED must be blank")
          if(continuous && (process.env.REF_TYPE !== "branch" || process.env.REF_NAME !== process.env.DEFAULT_BRANCH)) throw new Error("Continuous training must run from the default branch")
          if(continuous && !/^[0-9a-f]{40}$/.test(expectedSha)) throw new Error("Continuous training requires expected_sha as a full lowercase commit SHA")
          if(continuous && expectedSha !== process.env.EVENT_SHA) throw new Error("Continuous training checkout does not match expected_sha")
          if(!continuous && expectedSha !== "") throw new Error("expected_sha is reserved for continuous training")

          const outputs = {
              matrix: JSON.stringify({ shard: Array.from({ length: workers }, (_, index) => index) }),
              workers,
              training_matches: training,
              evaluation_matches: evaluation,
              base_seed: seed,
              minimum_score: minimumScore,
              minimum_games: minimumGames,
              continuous,
              expected_sha: expectedSha,
          }
          for(const [name, value] of Object.entries(outputs)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`)
          NODE
      - name: Require current main and successful exact-SHA CI
        if: ${{ steps.config.outputs.continuous == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ steps.config.outputs.expected_sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')
          if [ "$current_sha" != "$EXPECTED_SHA" ] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "Continuous training must use the exact current main SHA $EXPECTED_SHA." >&2
            exit 1
          fi
          ci_success=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$EXPECTED_SHA" -f status=success -f per_page=1 --jq '.total_count')
          if [ "$ci_success" -lt 1 ]; then
            echo "No successful CI run exists for exact SHA $EXPECTED_SHA." >&2
            exit 1
          fi
      - name: Refuse an unresolved promotion transaction
        if: ${{ steps.config.outputs.continuous == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retained=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/ai-promotion/" --jq '.[].ref')
          if [ -n "$retained" ]; then
            echo "Continuous training is blocked by retained promotion branch(es):" >&2
            echo "$retained" >&2
            echo "Reconcile or remove the unresolved transaction before training resumes." >&2
            exit 1
          fi
      - name: Fetch canonical hosted model
        env:
          AI_HOSTED_ENDPOINT: ${{ vars.AI_HOSTED_ENDPOINT }}
        run: |
          if [ -z "$AI_HOSTED_ENDPOINT" ]; then
            echo "AI_HOSTED_ENDPOINT is not configured." >&2
            exit 1
          fi
          npm run ai:hosted -- --mode fetch --endpoint "$AI_HOSTED_ENDPOINT" --output "$RUNNER_TEMP/hosted-baseline/baseline.json" --manifest "$RUNNER_TEMP/hosted-baseline/hosted-source.json"
          npm run ai:verify -- "$RUNNER_TEMP/hosted-baseline/baseline.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-hosted-baseline
          path: ${{ runner.temp }}/hosted-baseline
          retention-days: 14
          if-no-files-found: error

  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-hosted-baseline
          path: ${{ runner.temp }}/hosted-baseline
      - name: Train candidate shard
        env:
          BASE_SEED: ${{ needs.prepare.outputs.base_seed }}
          SHARD: ${{ matrix.shard }}
          MATCHES: ${{ needs.prepare.outputs.training_matches }}
        run: |
          seed=$((BASE_SEED + SHARD))
          npm run ai:worker -- --mode train --checkpoint "$RUNNER_TEMP/hosted-baseline/baseline.json" --seed "$seed" --shard "train-$SHARD" --matches "$MATCHES" --output "$RUNNER_TEMP/train-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-train-${{ matrix.shard }}
          path: ${{ runner.temp }}/train-${{ matrix.shard }}.json
          retention-days: 2
          if-no-files-found: error

  select:
    needs: [prepare, train]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-hosted-baseline
          path: ${{ runner.temp }}/hosted-baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ai-train-*
          path: ${{ runner.temp }}/train-results
          merge-multiple: true
      - name: Aggregate deterministic candidate
        run: npm run ai:select -- --results-dir "$RUNNER_TEMP/train-results" --baseline "$RUNNER_TEMP/hosted-baseline/baseline.json" --output "$RUNNER_TEMP/candidate/candidate.json" --report "$RUNNER_TEMP/candidate/candidate.selection.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 7
          if-no-files-found: error

  evaluate:
    needs: [prepare, select]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-hosted-baseline
          path: ${{ runner.temp }}/hosted-baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-candidate
          path: ${{ runner.temp }}/candidate
      - name: Evaluate frozen candidate shard
        env:
          BASE_SEED: ${{ needs.prepare.outputs.base_seed }}
          SHARD: ${{ matrix.shard }}
          MATCHES: ${{ needs.prepare.outputs.evaluation_matches }}
        run: |
          seed=$((BASE_SEED + 100000 + SHARD))
          npm run ai:worker -- --mode evaluate --checkpoint "$RUNNER_TEMP/candidate/candidate.json" --baseline "$RUNNER_TEMP/hosted-baseline/baseline.json" --seed "$seed" --shard "eval-$SHARD" --matches "$MATCHES" --output "$RUNNER_TEMP/eval-$SHARD.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-eval-${{ matrix.shard }}
          path: ${{ runner.temp }}/eval-${{ matrix.shard }}.json
          retention-days: 2
          if-no-files-found: error

  report:
    needs: [prepare, evaluate]
    runs-on: ubuntu-latest
    outputs:
      promotable: ${{ steps.decision.outputs.promotable }}
      candidate_sha256: ${{ steps.promotion.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-hosted-baseline
          path: ${{ runner.temp }}/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-candidate
          path: ${{ runner.temp }}/bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ai-eval-*
          path: ${{ runner.temp }}/eval-results
          merge-multiple: true
      - name: Build frozen evaluation report
        env:
          MINIMUM_SCORE: ${{ needs.prepare.outputs.minimum_score }}
          MINIMUM_GAMES: ${{ needs.prepare.outputs.minimum_games }}
        run: npm run ai:evaluate-report -- --results-dir "$RUNNER_TEMP/eval-results" --output "$RUNNER_TEMP/bundle/evaluation.json" --report "$RUNNER_TEMP/bundle/evaluation.md" --minimum-score "$MINIMUM_SCORE" --minimum-games "$MINIMUM_GAMES"
      - name: Publish job summary
        run: cat "$RUNNER_TEMP/bundle/evaluation.md" >> "$GITHUB_STEP_SUMMARY"
      - id: decision
        name: Record evaluation decision
        run: node -e "const fs=require('node:fs');const evaluation=require(process.argv[1]);fs.appendFileSync(process.env.GITHUB_OUTPUT,'promotable='+(evaluation.passed===true)+'\n');" "$RUNNER_TEMP/bundle/evaluation.json"
      - name: Enforce promotion artifact size limit
        run: |
          oversized=$(find "$RUNNER_TEMP/bundle" -type f -size "+${AI_ARTIFACT_MAX_BYTES}c" -print -quit)
          if [ -n "$oversized" ]; then
            echo "Promotion artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes: $oversized" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-training-bundle
          path: ${{ runner.temp }}/bundle
          retention-days: 90
          if-no-files-found: error
      - id: promotion
        name: Validate and stage continuous promotion
        if: ${{ needs.prepare.outputs.continuous == 'true' && steps.decision.outputs.promotable == 'true' }}
        run: |
          npm run ai:verify -- "$RUNNER_TEMP/bundle/candidate.json"
          npm run ai:verify -- "$RUNNER_TEMP/bundle/evaluation.json"
          npm run ai:verify-promotion -- --candidate "$RUNNER_TEMP/bundle/candidate.json" --evaluation "$RUNNER_TEMP/bundle/evaluation.json" --baseline "$RUNNER_TEMP/bundle/baseline.json" --minimum-score 0.58 --minimum-games 160
          cp "$RUNNER_TEMP/bundle/candidate.json" training/checkpoints/champion.json
          echo "candidate_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install browser for continuous promotion checks
        if: ${{ needs.prepare.outputs.continuous == 'true' && steps.decision.outputs.promotable == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Run continuous promotion checks
        if: ${{ needs.prepare.outputs.continuous == 'true' && steps.decision.outputs.promotable == 'true' }}
        run: npm test

  promote:
    needs: [prepare, report]
    if: ${{ needs.prepare.outputs.continuous == 'true' && needs.report.result == 'success' && needs.report.outputs.promotable == 'true' && vars.AI_CONTINUOUS_TRAINING_ENABLED == 'true' && vars.AI_HOSTED_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ai-checkpoint-promotion
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      promotion_branch: ${{ steps.promotion.outputs.promotion_branch }}
      promotion_sha: ${{ steps.promotion.outputs.promotion_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-training-bundle
          path: ${{ runner.temp }}/bundle
      - id: commit
        name: Prepare validated checkpoint commit
        env:
          CANDIDATE_SHA256: ${{ needs.report.outputs.candidate_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          current_sha=$(git rev-parse "origin/$DEFAULT_BRANCH")
          checkout_sha=$(git rev-parse HEAD)
          if [ "$current_sha" != "$GITHUB_SHA" ] || [ "$checkout_sha" != "$GITHUB_SHA" ]; then
            echo "Default branch changed after training began; refusing stale promotion." >&2
            exit 1
          fi

          if [ ! -f "$RUNNER_TEMP/bundle/candidate.json" ] || [ -L "$RUNNER_TEMP/bundle/candidate.json" ]; then
            echo "Candidate artifact is not a regular file." >&2
            exit 1
          fi
          candidate_size=$(stat -c%s "$RUNNER_TEMP/bundle/candidate.json")
          if [ "$candidate_size" -gt "$AI_ARTIFACT_MAX_BYTES" ]; then
            echo "Candidate artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes." >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)
          if [ -z "$CANDIDATE_SHA256" ] || [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo "Candidate artifact checksum changed after validation." >&2
            exit 1
          fi

          cp "$RUNNER_TEMP/bundle/candidate.json" training/checkpoints/champion.json
          git add training/checkpoints/champion.json
          if git diff --cached --quiet; then
            echo "Checkpoint is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git diff --cached --name-only)" != "training/checkpoints/champion.json" ]; then
            echo "Promotion attempted to modify unexpected files." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote AI checkpoint from run $GITHUB_RUN_ID"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - id: promotion
        name: Require CI on the exact promotion commit
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          promotion_branch="ai-promotion/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          promotion_sha=$(git rev-parse HEAD)
          keep_branch=false
          cleanup() {
            if [ "$keep_branch" != "true" ]; then
              git push origin --delete "$promotion_branch" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          git push origin "HEAD:refs/heads/$promotion_branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$promotion_branch"

          ci_run_id=""
          for _ in $(seq 1 30); do
            ci_run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$promotion_branch" --event workflow_dispatch --limit 100 --json databaseId,headSha --jq ".[] | select(.headSha == \"$promotion_sha\") | .databaseId" | head -n 1)
            if [ -n "$ci_run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$ci_run_id" ]; then
            echo "Could not locate the promotion CI run." >&2
            exit 1
          fi
          gh run watch "$ci_run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "promotion_branch=$promotion_branch" >> "$GITHUB_OUTPUT"
          echo "promotion_sha=$promotion_sha" >> "$GITHUB_OUTPUT"
          keep_branch=true

  publish-hosted:
    needs: [prepare, report, promote]
    if: ${{ always() && needs.promote.result == 'success' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    environment: production-ai
    concurrency:
      group: ai-hosted-promotion
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 2
          ref: ${{ needs.promote.outputs.promotion_sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-training-bundle
          path: ${{ runner.temp }}/bundle
      - name: Publish verified policy to the hosted model
        env:
          AI_HOSTED_ENDPOINT: ${{ vars.AI_HOSTED_ENDPOINT }}
          AI_POLICY_PROMOTION_KEY: ${{ secrets.AI_POLICY_PROMOTION_KEY }}
          CANDIDATE_SHA256: ${{ needs.report.outputs.candidate_sha256 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_SHA: ${{ needs.promote.outputs.promotion_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$PROMOTION_SHA" ]; then
            echo "Promotion commit or default branch changed before hosted publication." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$PROMOTION_SHA^")" != "$GITHUB_SHA" ] || [ "$(git diff-tree --no-commit-id --name-only -r "$PROMOTION_SHA")" != "training/checkpoints/champion.json" ]; then
            echo "Hosted publication was not built from the checked checkpoint-only commit." >&2
            exit 1
          fi
          candidate_size=$(stat -c%s "$RUNNER_TEMP/bundle/candidate.json")
          if [ "$candidate_size" -gt "$AI_ARTIFACT_MAX_BYTES" ]; then
            echo "Candidate artifact exceeds ${AI_ARTIFACT_MAX_BYTES} bytes." >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$RUNNER_TEMP/bundle/candidate.json" | cut -d ' ' -f 1)
          if [ -z "$CANDIDATE_SHA256" ] || [ "$actual_sha256" != "$CANDIDATE_SHA256" ]; then
            echo "Candidate artifact checksum changed before hosted publication." >&2
            exit 1
          fi
          npm run ai:hosted -- --mode publish --endpoint "$AI_HOSTED_ENDPOINT" --baseline "$RUNNER_TEMP/bundle/baseline.json" --manifest "$RUNNER_TEMP/bundle/hosted-source.json" --candidate "$RUNNER_TEMP/bundle/candidate.json" --evaluation "$RUNNER_TEMP/bundle/evaluation.json" --receipt "$RUNNER_TEMP/hosted-promotion-receipt.json" --minimum-score 0.58 --minimum-games 160
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          name: ai-hosted-promotion-receipt
          path: ${{ runner.temp }}/hosted-promotion-receipt.json
          retention-days: 30
          if-no-files-found: error

  finalize-promotion:
    needs: [prepare, report, promote, publish-hosted]
    if: ${{ always() && needs.promote.result == 'success' && needs.promote.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases/v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - id: merge
        name: Merge the checked promotion pull request
        if: ${{ needs.publish-hosted.result == 'success' && vars.AI_CONTINUOUS_TRAINING_ENABLED == 'true' && vars.AI_HOSTED_PROMOTION_ENABLED == 'true' }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMOTION_BRANCH: ${{ needs.promote.outputs.promotion_branch }}
          PROMOTION_SHA: ${{ needs.promote.outputs.promotion_sha }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$PROMOTION_BRANCH:refs/remotes/origin/$PROMOTION_BRANCH"
          if [ "$(git rev-parse "origin/$DEFAULT_BRANCH")" != "$GITHUB_SHA" ]; then
            echo "Default branch changed while promotion CI ran; refusing stale promotion." >&2
            exit 1
          fi
          if [ -z "$PROMOTION_SHA" ] || [ "$(git rev-parse "origin/$PROMOTION_BRANCH")" != "$PROMOTION_SHA" ]; then
            echo "Temporary promotion branch does not match the checked commit." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$PROMOTION_SHA^")" != "$GITHUB_SHA" ]; then
            echo "Promotion commit is not based on the training commit." >&2
            exit 1
          fi
          if [ "$(git diff-tree --no-commit-id --name-only -r "$PROMOTION_SHA")" != "training/checkpoints/champion.json" ]; then
            echo "Promotion commit contains unexpected files." >&2
            exit 1
          fi
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$PROMOTION_BRANCH" \
            --title "Promote AI checkpoint from run $RUN_ID" \
            --body "This checkpoint passed exact-commit CI and hosted publication. Merge only this checkpoint-only promotion commit.")
          pr_number="${pr_url##*/}"
          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "GitHub returned an invalid promotion pull request URL: $pr_url" >&2
            exit 1
          fi
          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required --watch --interval 10
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --subject "Promote AI checkpoint from run $RUN_ID" \
            --body "Merge the validated checkpoint after required branch-protection checks passed."
      - name: Remove temporary promotion branch
        if: ${{ always() }}
        env:
          PROMOTION_BRANCH: ${{ needs.promote.outputs.promotion_branch }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          if [ -n "$PROMOTION_BRANCH" ] && [ "$MERGE_OUTCOME" = "success" ]; then
            git push origin --delete "$PROMOTION_BRANCH" >/dev/null 2>&1 || true
          elif [ -n "$PROMOTION_BRANCH" ]; then
            echo "Retaining $PROMOTION_BRANCH for hosted/audit reconciliation." >> "$GITHUB_STEP_SUMMARY"
          fi
